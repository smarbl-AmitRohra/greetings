<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at center, #2e081d 0%, #17030e 100%);
  color: #fff8eb;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: 16px 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

.font-cinzel {
  font-family: 'Cinzel', serif;
}

main {
  width: 100%;
  max-width: 460px;
  margin: auto;
  position: relative;
  z-index: 2;
}

.festive-card {
  background: rgba(35, 8, 22, 0.92);
  border: 2px solid #d4af37;
  border-radius: 24px;
  padding: clamp(14px, 4vw, 28px);
  box-shadow: 0 15px 35px rgba(0,0,0,.6),
              0 0 25px rgba(212,175,55,.25);
  overflow: hidden;
}

.bg-sparkle {
  position: fixed;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(255,215,0,.15);
  filter: blur(45px);
  pointer-events: none;
}

.flame {
  transform-origin: center bottom;
  animation: flicker 1.8s infinite alternate;
}

@keyframes flicker {
  50% {
    transform: scale(1.08) rotate(2deg);
    filter: drop-shadow(0 0 8px orange);
  }
}

.gold-divider {
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    #d4af37,
    #fcf6ba,
    #d4af37,
    transparent
  );
}

.shimmer-container {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 16px;
}

#scratchArea {
  position: relative;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  touch-action: none;
}

#hiddenContent {
  width: 100%;
  min-height: 310px;
  padding: 16px;
  background: linear-gradient(
    to bottom,
    #3b105f,
    #4c0830
  );
  border: 1px solid rgba(245,158,11,.3);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#scratchCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
  touch-action: none;
  cursor: pointer;
}

#revealedAnnouncement {
  width: 100%;
}

#revealedAnnouncement svg {
  width: clamp(200px, 65vw, 260px);
  max-width: 100%;
  height: auto;
}

.reveal-animation {
  animation: popIn .8s ease forwards;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(.85) translateY(15px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@media(max-width: 360px) {
  body {
    padding: 10px 8px;
  }

  .festive-card {
    padding: 12px 10px;
  }

  #hiddenContent {
    min-height: 270px;
    padding: 10px;
  }
}

@media(min-width: 600px) {
  body {
    padding: 28px;
  }
}

@media(max-height: 650px) {
  body {
    align-items: flex-start;
  }

  main {
    margin-top: 8px;
  }
}

@media(prefers-reduced-motion: reduce) {
  .flame,
  .reveal-animation {
    animation: none;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d', {
    willReadFrequently: true
  });

  const container = document.getElementById('scratchArea');

  const placeholderText =
    document.getElementById('placeholderText');

  const revealedAnnouncement =
    document.getElementById('revealedAnnouncement');

  const scratchPrompt =
    document.getElementById('scratchPrompt');

  let isDrawing = false;
  let isRevealed = false;
  let width = 0;
  let height = 0;
  let lastCheck = 0;

  // Initialize canvas with high DPI support
  function initCanvas() {

    if (isRevealed) return;

    const rect = container.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawGoldenSurface();
  }

  // Draw metallic golden scratch surface
  function drawGoldenSurface() {

    const grad = ctx.createLinearGradient(
      0, 0, width, height
    );

    grad.addColorStop(0, '#bf953f');
    grad.addColorStop(0.25, '#fcf6ba');
    grad.addColorStop(0.5, '#b38728');
    grad.addColorStop(0.75, '#fbf5b7');
    grad.addColorStop(1, '#aa771c');

    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Golden texture
    ctx.fillStyle = 'rgba(255,255,255,0.08)';

    for (let x = 0; x < width; x += 8) {
      for (let y = 0; y < height; y += 8) {

        if ((x + y) % 16 === 0) {
          ctx.fillRect(x, y, 4, 4);
        }

      }
    }

    // Scratch instruction
    ctx.fillStyle = '#3a2100';

    ctx.font = 'bold 14px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.shadowColor = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 4;

    ctx.fillText(
      '✨ SCRATCH TO REVEAL ✨',
      width / 2,
      height / 2
    );

    ctx.shadowBlur = 0;
  }

  // Calculate pointer position
  function getPointerPos(e) {

    const rect = canvas.getBoundingClientRect();

    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  // Scratch action
  function scratch(e) {

    if (!isDrawing || isRevealed) return;

    if (e.cancelable) {
      e.preventDefault();
    }

    const pos = getPointerPos(e);

    ctx.globalCompositeOperation = 'destination-out';

    ctx.beginPath();

    ctx.arc(
      pos.x,
      pos.y,
      22,
      0,
      Math.PI * 2
    );

    ctx.fill();

    // Avoid checking pixels on every movement
    const now = performance.now();

    if (now - lastCheck > 120) {
      lastCheck = now;
      checkScratchProgress();
    }
  }

  // Check scratched percentage
  function checkScratchProgress() {

    if (isRevealed) return;

    const pixels = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;

    const step = 4 * 16;

    let transparentPixels = 0;
    let totalSampled = 0;

    for (
      let i = 3;
      i < pixels.length;
      i += step
    ) {

      totalSampled++;

      if (pixels[i] === 0) {
        transparentPixels++;
      }
    }

    const percentage =
      (transparentPixels / totalSampled) * 100;

    // Reveal after 40% scratched
    if (percentage >= 40) {
      triggerAutoReveal();
    }
  }

  // Reveal announcement
  function triggerAutoReveal() {

    if (isRevealed) return;

    isRevealed = true;
    isDrawing = false;

    // Fade scratch layer
    canvas.style.transition = 'opacity 700ms ease';
    canvas.style.opacity = '0';

    setTimeout(() => {
      canvas.style.display = 'none';
    }, 700);

    // Update instruction
    scratchPrompt.style.opacity = '0';

    setTimeout(() => {

      scratchPrompt.innerHTML = '✨ 💖 ✨';
      scratchPrompt.style.opacity = '1';

    }, 300);

    // Show announcement
    placeholderText.classList.add('hidden');

    revealedAnnouncement.classList.remove('hidden');

    revealedAnnouncement.classList.add(
      'flex',
      'reveal-animation'
    );

    // Celebrate!
    launchCelebratoryConfetti();
  }

  // Confetti animation
  function launchCelebratoryConfetti() {

    if (typeof confetti !== 'function') return;

    // Main burst
    confetti({
      particleCount: 65,
      spread: 60,
      origin: {
        y: 0.65
      },
      colors: [
        '#FFD700',
        '#FFA500',
        '#FF69B4',
        '#FFFFFF'
      ]
    });

    // Side bursts
    setTimeout(() => {

      confetti({
        particleCount: 35,
        angle: 60,
        spread: 55,
        origin: {
          x: 0
        },
        colors: [
          '#FFD700',
          '#F8BBD0',
          '#FF69B4'
        ]
      });

      confetti({
        particleCount: 35,
        angle: 120,
        spread: 55,
        origin: {
          x: 1
        },
        colors: [
          '#FFD700',
          '#F8BBD0',
          '#FF69B4'
        ]
      });

    }, 200);
  }

  // Pointer events: mobile, tablet and desktop
  canvas.addEventListener('pointerdown', (e) => {

    if (isRevealed) return;

    isDrawing = true;

    if (canvas.setPointerCapture) {
      canvas.setPointerCapture(e.pointerId);
    }

    scratch(e);
  });

  canvas.addEventListener('pointermove', (e) => {

    if (isDrawing) {
      scratch(e);
    }
  });

  canvas.addEventListener('pointerup', () => {
    isDrawing = false;
  });

  canvas.addEventListener('pointercancel', () => {
    isDrawing = false;
  });

  canvas.addEventListener('lostpointercapture', () => {
    isDrawing = false;
  });

  // Responsive resize
  let resizeTimer;

  window.addEventListener('resize', () => {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {
      initCanvas();
    }, 150);

  });

  // Screen orientation changes
  window.addEventListener('orientationchange', () => {

    setTimeout(() => {
      initCanvas();
    }, 300);

  });

  // Initial setup
  initCanvas();

  // Redraw after fonts load
  if (document.fonts && document.fonts.ready) {

    document.fonts.ready.then(() => {

      if (!isRevealed) {
        initCanvas();
      }

    });

  }

});
</script>
